<style>
/* ============================================================
   Lanello Heights — "glazed-tile"
   One big color moment (cobalt), ink + white ground, sun for badges only.
   ============================================================ */
:root {
  --white: #FFFFFF;
  --ink: #0D1117;
  --cobalt: #1D3BD1;
  --cobalt-deep: #1630B0;
  --panel: #EEEEEE;
  --gray: #444444;
  --sun: #FFC845;

  --line: rgba(13, 17, 23, .14);
  --line-light: rgba(255, 255, 255, .16);
  --muted-light: rgba(255, 255, 255, .72);

  --sans: "Inter Tight", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;

  --max: 1440px;
  --pad: clamp(20px, 4.45vw, 64px);
  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 12px;

  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-io: cubic-bezier(.65, 0, .35, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--white);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2, h3, p, dl, dd, ol, ul, figure { margin: 0; }
ol, ul { padding: 0; list-style: none; }

.wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); }

.skip {
  position: absolute; left: 12px; top: -60px; z-index: 100;
  background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 999px;
}
.skip:focus { top: 12px; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

/* ---------- Type ---------- */
.display {
  font-weight: 800;
  letter-spacing: -.04em;
  line-height: .96;
}
.hero-title { font-size: clamp(48px, 7.3vw, 108px); }
.h2 { font-size: clamp(40px, 4.7vw, 68px); }
.accent {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  letter-spacing: -.01em;
  color: var(--cobalt);
  padding-right: .04em;
}
.accent-light { color: var(--white); }
.features .accent-light { color: var(--white); }

.eyebrow {
  font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--cobalt); margin-bottom: 22px;
}
.eyebrow-sun { color: var(--sun); }

.line { display: block; overflow: hidden; padding-bottom: .06em; margin-bottom: -.06em; }
.line > span { display: inline-block; }

.badge {
  display: inline-block;
  background: var(--sun); color: var(--ink);
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  padding: 7px 14px; border-radius: 999px;
}
.badge-sm { font-size: 11px; padding: 6px 12px; }

/* ---------- Buttons ---------- */
.btn {
  --h: 52px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: var(--h); padding: 0 26px; border-radius: 999px;
  font-size: 15px; font-weight: 600; letter-spacing: -.005em;
  text-decoration: none; border: 1.5px solid transparent; cursor: pointer;
  transition: background-color .25s, color .25s, border-color .25s, transform .4s var(--ease-out);
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-sm { --h: 42px; padding: 0 20px; font-size: 14px; }
.btn-block { width: 100%; }
.btn-ink { background: var(--ink); color: var(--white); }
.btn-ink:hover { background: var(--cobalt); }
.btn-cobalt { background: var(--cobalt); color: var(--white); }
.btn-cobalt:hover { background: var(--ink); }
.btn-outline { background: transparent; border-color: var(--ink); color: var(--ink); }
.btn-outline:hover { background: var(--ink); color: var(--white); }
.play { width: 14px; height: 14px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; }

.text-link {
  display: inline-flex; gap: 8px; align-items: center;
  font-weight: 600; font-size: 15px; color: var(--cobalt); text-decoration: none;
  border-bottom: 1.5px solid currentColor; padding-bottom: 3px;
}
.text-link span { transition: transform .35s var(--ease-out); }
.text-link:hover span { transform: translateX(5px); }
.text-link-light { color: var(--white); }

/* ---------- Header (logo + one CTA, no nav) ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 255, 255, 0);
  transition: background-color .35s, box-shadow .35s, transform .5s var(--ease-out);
}
.site-header.is-scrolled {
  background: rgba(255, 255, 255, .9);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  backdrop-filter: saturate(1.4) blur(14px);
  box-shadow: 0 1px 0 var(--line);
}
.site-header.is-hidden { transform: translateY(-100%); }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 84px; }
.brand { display: inline-flex; align-items: center; text-decoration: none; }
.brand-logo { height: 58px; width: auto; transition: transform .5s var(--ease-out); }
.brand:hover .brand-logo { transform: scale(1.03); }
.brand-logo-footer { height: 64px; }

/* ---------- Hero ---------- */
.hero { padding: 28px 0 0; }
.hero-top {
  display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: 48px; align-items: end;
}
.hero-copy .badge { margin-bottom: 26px; }
.hero-aside { padding-bottom: 14px; max-width: 380px; justify-self: end; }
.hero-aside p { color: var(--gray); font-size: 16px; margin-bottom: 22px; }

.hero-band {
  position: relative; margin-top: 64px;
  height: clamp(420px, 38vw, 560px);
  border-radius: var(--radius-lg); overflow: hidden;
  background: var(--cobalt);
  isolation: isolate;
}
.slides, .slide { position: absolute; inset: 0; }
.slide { opacity: 0; transition: opacity 1.2s var(--ease-io); }
.slide.is-active { opacity: 1; z-index: 1; }
.slide.is-prev { opacity: 1; z-index: 0; transition: none; }
.slide img {
  width: 100%; height: calc(100% + 120px); margin-top: -60px; object-fit: cover;
  transform: scale(1.12) translate3d(0, var(--py, 0px), 0);
  transition: transform 7s linear;
  will-change: transform;
}
.slide.is-active img { transform: scale(1.02) translate3d(0, var(--py, 0px), 0); }
.band-shade {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(13,17,23,.32) 0%, rgba(13,17,23,0) 30%),
    linear-gradient(0deg, rgba(13,17,23,.55) 0%, rgba(13,17,23,0) 32%);
}
.chips { position: absolute; z-index: 3; top: 28px; left: 28px; display: flex; gap: 10px; flex-wrap: wrap; }
.chip {
  background: var(--white); border-radius: 14px; padding: 12px 18px 12px;
  min-width: 112px; box-shadow: 0 8px 24px rgba(13,17,23,.12);
}
.chip strong { font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.chip .unit { font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin-left: 2px; }
.chip small {
  display: block; margin-top: 6px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--gray);
}
.band-foot {
  position: absolute; z-index: 3; left: 28px; right: 28px; bottom: 22px;
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  color: var(--white);
}
.band-caption { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.dots { display: flex; gap: 8px; }
.dots button {
  width: 44px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer;
  display: grid; place-items: center;
}
.dots i { display: block; width: 100%; height: 3px; border-radius: 3px; background: rgba(255,255,255,.35); position: relative; overflow: hidden; }
.dots i::after { content: ""; position: absolute; inset: 0; background: var(--white); transform: scaleX(0); transform-origin: left; }
.dots [aria-selected="true"] i::after { animation: dotfill var(--slide-ms, 5600ms) linear forwards; }
.hero-band.is-paused .dots [aria-selected="true"] i::after { animation-play-state: paused; }
@keyframes dotfill { to { transform: scaleX(1); } }

/* ---------- Sections ---------- */
.section { padding: clamp(80px, 9vw, 136px) 0; }
.section-head {
  display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 40px; align-items: end; margin-bottom: 56px;
}
.section-lede { color: var(--gray); max-width: 360px; justify-self: end; padding-bottom: 8px; }

/* ---------- Model cards ---------- */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
.card {
  background: var(--panel); border-radius: var(--radius-md); padding: 10px;
  display: flex; flex-direction: column;
  transition: transform .6s var(--ease-out), box-shadow .6s var(--ease-out);
}
.card:hover { transform: translateY(-6px); box-shadow: 0 24px 48px -24px rgba(13,17,23,.35); }
.card-media { position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius-sm); overflow: hidden; background: #d9d9d9; }
.card-media img {
  width: 100%; height: 118%; object-fit: cover; margin-top: -9%;
  transform: translate3d(0, var(--py, 0px), 0) scale(1.001);
  transition: scale .9s var(--ease-out);
}
.card:hover .card-media img { scale: 1.05; }
.card-media .badge { position: absolute; left: 14px; top: 14px; }
.card-body { padding: 22px 14px 16px; display: flex; flex-direction: column; flex: 1; }
.card-title {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px;
}
.model-name { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: -.01em; }
.meta { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--gray); white-space: nowrap; }
.specs { display: flex; gap: 28px; margin-bottom: 22px; }
.specs dt { font-size: 22px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.specs dd { font-size: 12.5px; color: var(--gray); margin-top: 4px; }
.card-link {
  margin-top: auto; align-self: flex-start;
  font-size: 14px; font-weight: 600; text-decoration: none; color: var(--cobalt);
  display: inline-flex; gap: 6px;
}
.card-link span { transition: transform .35s var(--ease-out); }
.card-link:hover span { transform: translateX(5px); }

.card-featured { background: var(--cobalt); color: var(--white); }
.card-featured .card-title { border-color: var(--line-light); }
.card-featured .meta, .card-featured .specs dd { color: var(--muted-light); }
.card-featured .card-link { color: var(--white); }

/* ---------- Features (ink) ---------- */
.features { background: var(--ink); color: var(--white); position: relative; }
.features-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 72px; }
.features-intro { align-self: start; position: sticky; top: 120px; }
.features-intro .h2 { margin-bottom: 26px; }
.muted-light { color: var(--muted-light); max-width: 400px; margin-bottom: 30px; }
.list-label {
  font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  padding-bottom: 14px; border-bottom: 1px solid var(--line-light);
}
.rows + .list-label { margin-top: 64px; }
.row {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center;
  min-height: 70px; padding: 14px 0; border-bottom: 1px solid var(--line-light);
  position: relative; cursor: default;
}
.row::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: var(--sun); transform: scaleX(0); transform-origin: left;
  transition: transform .6s var(--ease-out);
}
.row:hover::before { transform: scaleX(1); }
.idx { width: 56px; flex-shrink: 0; font-size: 12px; font-weight: 600; color: var(--sun); font-variant-numeric: tabular-nums; }
.row-title { font-size: clamp(19px, 1.6vw, 23px); font-weight: 600; letter-spacing: -.025em; transition: transform .5s var(--ease-out); }
.row:hover .row-title { transform: translateX(8px); }
.row-note { font-size: 13.5px; color: var(--muted-light); text-align: right; padding-left: 16px; }

.preview {
  position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none;
  width: 260px; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden;
  opacity: 0; transform: translate3d(-50%, -50%, 0) scale(.85);
  transition: opacity .35s, scale .5s var(--ease-out);
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
}
.preview.is-on { opacity: 1; }
.preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
.preview img.is-on { opacity: 1; }

/* ---------- Location ---------- */
.location-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 72px; align-items: center; }
.map-panel { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: var(--panel); aspect-ratio: 1.25 / 1; }
.map { position: absolute; inset: 0; z-index: 1; }
.map iframe { width: 100%; height: 100%; border: 0; }
.leaflet-container { background: var(--panel); font-family: var(--sans); }
.leaflet-tile-pane { filter: grayscale(1) contrast(.92) brightness(1.04); }
.leaflet-control-attribution { font-size: 10px; }
.map-tag {
  position: absolute; z-index: 500; left: 18px;
  background: var(--ink); color: var(--white);
  font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  padding: 6px 12px; border-radius: 999px; pointer-events: none;
}
.map-tag-top { top: 18px; }
.map-tag-bottom { bottom: 26px; }
.pin { position: relative; width: 0; height: 0; }
.pin-halo {
  position: absolute; left: -56px; top: -56px; width: 112px; height: 112px; border-radius: 50%;
  background: rgba(29, 59, 209, .16);
  animation: halo 2.8s var(--ease-out) infinite;
}
.pin-dot {
  position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--white); border: 3px solid var(--cobalt);
  display: grid; place-items: center;
}
.pin-dot::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--cobalt); }
.pin-label {
  position: absolute; left: 22px; top: -14px; white-space: nowrap;
  background: var(--cobalt); color: var(--white); font-size: 12px; font-weight: 600;
  padding: 5px 12px; border-radius: 8px;
}
@keyframes halo { 0% { transform: scale(.55); opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }

.location-copy .h2 { margin-bottom: 22px; }
.body-copy { color: var(--gray); max-width: 460px; margin-bottom: 40px; }
.distances { border-top: 1.5px solid var(--ink); margin-bottom: 32px; }
.distances li {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 18px 0; border-bottom: 1.5px solid var(--ink);
}
.distances span { font-weight: 500; }
.distances strong { color: var(--cobalt); font-size: 22px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.distances b { font-weight: 800; }

/* ---------- Value + inquiry (cobalt) ---------- */
.value { background: var(--cobalt); color: var(--white); }
.value-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 72px; align-items: center; }
.value-copy .h2 { margin-bottom: 52px; }
.stats { border-top: 1px solid var(--line-light); }
.stat {
  display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr); gap: 24px; align-items: center;
  padding: 24px 0; border-bottom: 1px solid var(--line-light);
}
.stat dt { font-size: clamp(40px, 4vw, 56px); font-weight: 800; letter-spacing: -.045em; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat dt b { font-weight: 800; }
.stat dd { color: var(--muted-light); font-size: 15px; max-width: 260px; }

.form-card {
  background: var(--white); color: var(--ink); border-radius: var(--radius-lg);
  padding: clamp(24px, 3vw, 40px); max-width: 520px; width: 100%; justify-self: end;
  box-shadow: 0 40px 80px -40px rgba(5, 12, 60, .55);
}
.form-title { font-size: clamp(24px, 2.2vw, 30px); font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }
.form-sub { color: var(--gray); font-size: 14px; margin: 8px 0 26px; }
.field { border: 0; padding: 0; margin: 0 0 18px; min-width: 0; }
.field label, .field legend {
  display: block; padding: 0; margin-bottom: 8px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
}
.field input[type="text"], .field input[type="tel"] {
  width: 100%; height: 50px; padding: 0 16px;
  font: 500 16px/1 var(--sans); color: var(--ink);
  background: var(--panel); border: 1.5px solid transparent; border-radius: 12px;
  transition: border-color .2s, background-color .2s;
}
.field input::placeholder { color: #8a8a8a; }
.field input:focus { outline: none; border-color: var(--cobalt); background: var(--white); }
.field input[aria-invalid="true"] { border-color: #C62828; background: #FFF5F5; }
.error { color: #B3261E; font-size: 13px; font-weight: 500; min-height: 0; margin-top: 6px; }
.error:empty { display: none; }
.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pill { position: relative; cursor: pointer; }
.pill input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pill span {
  display: grid; place-items: center; height: 44px; border-radius: 999px;
  border: 1.5px solid var(--ink); font-size: 14px; font-weight: 600;
  transition: background-color .2s, color .2s, transform .3s var(--ease-out);
}
.pill input:checked + span { background: var(--ink); color: var(--white); }
.pill input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: 2px; }
.pill:hover span { transform: translateY(-1px); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

#f-submit { margin-top: 8px; position: relative; }
.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2.5px solid rgba(255,255,255,.35); border-top-color: var(--white);
  display: none; animation: spin .7s linear infinite;
}
#f-submit.is-loading { pointer-events: none; opacity: .85; }
#f-submit.is-loading .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.form-status { font-size: 14px; font-weight: 500; margin-top: 14px; border-radius: 12px; }
.form-status:empty { display: none; }
.form-status.is-ok { background: #E8F5E9; color: #1B5E20; padding: 12px 14px; }
.form-status.is-err { background: #FDECEA; color: #8C1D18; padding: 12px 14px; }
.form-fine { font-size: 12px; color: #6b6b6b; margin-top: 14px; line-height: 1.5; }

/* ---------- Footer ---------- */
.site-footer { background: var(--ink); color: var(--white); padding: 40px 0 36px; }
.footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
.footer-addr { font-size: 13px; color: var(--muted-light); }
.footer-fine {
  display: flex; align-items: center; gap: 20px 32px; flex-wrap: wrap;
  margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line-light);
  font-size: 12.5px; color: rgba(255,255,255,.6);
}
.footer-fine a { color: var(--white); text-decoration: none; }
.footer-fine a:hover { text-decoration: underline; }

/* ---------- Video modal ---------- */
.modal { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; }
.modal[hidden] { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(13,17,23,.82); opacity: 0; transition: opacity .4s; }
.modal-box {
  position: relative; width: min(1040px, 100%);
  opacity: 0; transform: translateY(24px) scale(.97);
  transition: opacity .45s var(--ease-out), transform .6s var(--ease-out);
}
.modal.is-open .modal-backdrop { opacity: 1; }
.modal.is-open .modal-box { opacity: 1; transform: none; }
.video-frame {
  aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden;
  background: var(--ink) center / cover no-repeat;
}
.video-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
.modal-close {
  position: absolute; right: 0; top: -52px; width: 42px; height: 42px; border-radius: 50%;
  border: 0; background: var(--white); color: var(--ink); font-size: 26px; line-height: 1; cursor: pointer;
}
.modal-cta { margin-top: 16px; }

/* ---------- Sticky mobile CTA ---------- */
.sticky-cta {
  position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 60;
  display: none; box-shadow: 0 16px 32px -12px rgba(29,59,209,.6);
  transform: translateY(140%); transition: transform .5s var(--ease-out);
}
.sticky-cta.is-on { transform: none; }

/* ============================================================
   Motion (Aboitiz Land-style): masked line rises, clip-path image
   wipes, slow ken-burns, parallax and counters.
   Initial states apply only when JS runs (.js) and motion is allowed.
   ============================================================ */
.js.motion .line > span { transform: translate3d(0, 105%, 0); transition: transform 1.1s var(--ease-out); transition-delay: calc(var(--i, 0) * 90ms + var(--d, 0s)); }
.js.motion .is-in .line > span, .js.motion .line.is-in > span { transform: none; }

.js.motion [data-reveal]:not([data-reveal="clip"]) {
  opacity: 0; transform: translate3d(0, 28px, 0);
  transition: opacity 1s var(--ease-out), transform 1.1s var(--ease-out);
  transition-delay: var(--d, 0s);
}
